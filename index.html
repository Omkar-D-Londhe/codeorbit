<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111219" />
    <meta name="description" content="CodeOrbit — an HTML learning studio with a Learning Orbit, quizzes and a safe practice lab." />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://validator.w3.org https://generativelanguage.googleapis.com blob: ws: wss:; frame-src 'self' blob: data:; object-src 'none';"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>CodeOrbit — learn HTML by exploring</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('codeorbit:settings:early');
          if (raw) {
            var s = JSON.parse(raw);
            var doc = document.documentElement;
            if (s.theme) doc.setAttribute('data-theme', s.theme);
            if (s.accent) doc.setAttribute('data-accent', s.accent);
            if (s.contrast) doc.setAttribute('data-contrast', s.contrast);
            if (s.motion && s.motion !== 'system') doc.setAttribute('data-motion', s.motion);
            doc.style.colorScheme = s.theme === 'starlight' ? 'light' : 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
